name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer braucht die Historie inkl. Tags

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Version ermitteln
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "v=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # Vor allem anderen: ohne Abschnitt in CHANGELOG.md bricht das Release hier
      # ab, statt ein Paket ohne Versionshinweise auf den Share zu bringen.
      # Muster aus QrCodeBuilder.
      - name: Versionshinweise aus CHANGELOG.md
        if: github.ref_type == 'tag'
        shell: bash
        run: bash scripts/extract-notes.sh "${{ steps.ver.outputs.v }}"

      - name: Test
        run: dotnet test DnsPilot.Tests/DnsPilot.Tests.csproj -c Release

      - name: Publish (win-x64)
        run: >
          dotnet publish DnsPilot/DnsPilot.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.v }}
          -o publish/win-x64

      # Der Dateiname ist Teil der Schnittstelle: der Update-Checker liest die
      # Version daraus (siehe UpdateChannel.ParseVersionFromFileName). Wer ihn
      # ändert, macht das Ausrollen über den Netzwerkordner kaputt.
      # Debug-Symbole gehören nicht ins Paket: SkiaSharp und HarfBuzz legen ihre
      # nativen PDBs (zusammen über 100 MB) neben die EXE. Rekursiv löschen —
      # ein "*.pdb" nur auf oberster Ebene reicht bei anderen Paketen nicht.
      # Ohne das wog v0.1.0 73 MB statt rund 45 MB.
      - name: Debug-Symbole entfernen
        shell: pwsh
        run: Get-ChildItem publish/win-x64 -Recurse -Filter *.pdb | Remove-Item -Force

      - name: ZIP packen
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath "DnsPilot-${{ steps.ver.outputs.v }}-win-x64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            DnsPilot-*-win-x64.zip
            DnsPilot-*-notes.md
          retention-days: 1

  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    # Beim manuellen Start (workflow_dispatch ohne Tag) überspringen.
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Version ermitteln
        id: ver
        shell: bash
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Die Versionshinweise sind zugleich der Release-Text.
      # Ausrollen: scripts/publish-share.ps1 -Version X.Y.Z legt Notes und Paket
      # geprüft (SHA-256 gegen dieses Release) auf den Update-Share
      # \\samba01\542$\5424_IT-Basis-Dienste\DnsPilot.
      - name: GitHub-Release anlegen/aktualisieren
        uses: softprops/action-gh-release@v3
        with:
          body_path: dist/windows/DnsPilot-${{ steps.ver.outputs.v }}-notes.md
          files: dist/**/*
          fail_on_unmatched_files: true
